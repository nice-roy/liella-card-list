<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Liella! のメンバーカード一覧とライブカード一覧">
  <title>Liella! カード一覧</title>
  <style>
    :root { color-scheme: dark; --ink:#fffaf8; --muted:#d9cdd7; --panel:rgba(33,22,38,.82); --line:rgba(255,255,255,.15); --pink:#ff5f9e; --violet:#8b70ff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:"Yu Gothic UI","Hiragino Kaku Gothic ProN",system-ui,sans-serif; color:var(--ink); background:radial-gradient(circle at 15% 10%,#8e315d 0,transparent 32%),radial-gradient(circle at 85% 85%,#49359e 0,transparent 34%),#17101c; }
    main { width:min(980px,calc(100% - 32px)); margin:auto; padding:clamp(56px,9vw,110px) 0; }
    .eyebrow { margin:0 0 12px; color:#ffb5d2; font-weight:800; letter-spacing:.13em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(2.6rem,8vw,5.8rem); line-height:.98; letter-spacing:-.05em; }
    h1 em { color:#ff78ad; font-style:normal; }
    .lead { max-width:650px; margin:24px 0 44px; color:var(--muted); font-size:clamp(1rem,2vw,1.2rem); line-height:1.8; }
    .cards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; }
    .card { position:relative; display:flex; min-height:250px; flex-direction:column; justify-content:space-between; padding:28px; color:inherit; text-decoration:none; border:1px solid var(--line); border-radius:24px; background:var(--panel); box-shadow:0 22px 70px rgba(0,0,0,.25); backdrop-filter:blur(16px); transition:transform .2s ease,border-color .2s ease,background .2s ease; overflow:hidden; }
    .card::after { content:""; position:absolute; width:180px; height:180px; right:-60px; top:-70px; border-radius:50%; background:var(--accent); opacity:.22; filter:blur(2px); }
    .card:hover,.card:focus-visible { transform:translateY(-5px); border-color:rgba(255,255,255,.42); background:rgba(48,31,55,.92); outline:none; }
    .label { position:relative; z-index:1; margin:0; color:#d9ccd6; font-size:.78rem; font-weight:800; letter-spacing:.15em; }
    h2 { position:relative; z-index:1; margin:12px 0 8px; font-size:clamp(1.5rem,3.5vw,2.2rem); line-height:1.25; }
    .desc { position:relative; z-index:1; margin:0; color:var(--muted); line-height:1.7; }
    .go { position:relative; z-index:1; align-self:flex-end; margin-top:24px; font-size:1.8rem; }
    footer { margin-top:30px; color:#aa9eaa; font-size:.8rem; }
    @media (max-width:700px) { .cards { grid-template-columns:1fr; } .card { min-height:220px; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Love Live! Official Card Game</p>
    <h1><em>Liella!</em><br>カード一覧</h1>
    <p class="lead">見たいカード一覧を選んでください。メンバーカードはコストやメンバーから、ライブカードはスコア順に確認できます。</p>
    <nav class="cards" aria-label="カード一覧">
      <a class="card" href="./members/" style="--accent:var(--pink)">
        <div><p class="label">MEMBER CARDS</p><h2>Liella!<br>メンバーカード一覧</h2><p class="desc">コスト・メンバーで絞り込み、カードを比較できます。</p></div><span class="go" aria-hidden="true">→</span>
      </a>
      <a class="card" href="./live/" style="--accent:var(--violet)">
        <div><p class="label">LIVE CARDS</p><h2>Liella!<br>ライブカード一覧</h2><p class="desc">ライブカードをスコア順に見やすく確認できます。</p></div><span class="go" aria-hidden="true">→</span>
      </a>
    </nav>
    <footer>Unofficial fan-made card list</footer>
  </main>
</body>
</html>
