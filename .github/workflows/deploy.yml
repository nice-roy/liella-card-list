name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "members/**"
      - "live/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy liella-card-list
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install --global wrangler@4.127.1

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy . --project-name=liella-card-list --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
